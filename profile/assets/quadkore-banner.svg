<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">QuadKore — Ideas made useful.</title>
  <desc id="banner-desc">We bring people and ideas together to create software, web experiences, and tools for everyday life.</desc>
  <defs>
    <style>
      .bg { fill: #141716; }
      .surface { fill: #1b1f1d; stroke: #252b27; stroke-width: 1.5; }
      .pill { fill: #252b27; }
      .fg { fill: #f1f1e9; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .muted { fill: #acb4ac; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .accent { fill: #bed6a5; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; }
      .headline { font-size: 56px; font-weight: 700; letter-spacing: -1.4px; }
      .subhead { font-size: 18px; font-weight: 400; letter-spacing: -0.1px; }
      .card-label { font-size: 13px; font-weight: 500; letter-spacing: 0.2px; }
      .card-footer { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
      .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
      .tag-text { font-size: 12px; font-weight: 500; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Main Canvas (#141716) -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Outer Frame -->
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.25" fill="none" stroke="#252b27" stroke-width="1.5" />

  <!-- Left Column: Brand Header + Hero Copy -->
  <g transform="translate(64, 52)">
    <!-- Brand Mark + Wordmark -->
    <g transform="translate(0, 0)">
      <svg x="0" y="0" width="28" height="28" viewBox="0 0 32 32" fill="none">
        <path d="M4 4h9v11L24 4h8L19 17l13 11H20L13 21v7H4V4Z" fill="#f1f1e9" />
        <path d="M4 4h3v24H4z" fill="#bed6a5" />
      </svg>
      <text x="38" y="20" class="fg brand-name">QuadKore<tspan fill="#bed6a5">.</tspan></text>
    </g>

    <!-- Eyebrow -->
    <g transform="translate(0, 56)">
      <rect x="0" y="-9" width="20" height="2" fill="#bed6a5" />
      <text x="30" y="-4" class="accent eyebrow">Welcome to QuadKore</text>
    </g>

    <!-- Headline -->
    <text x="0" y="116" class="fg headline">Ideas made <tspan class="accent">useful.</tspan></text>

    <!-- Description -->
    <text x="0" y="160" class="muted subhead">We bring people and ideas together to create software, web experiences,</text>
    <text x="0" y="186" class="muted subhead">and practical tools for everyday life.</text>

    <!-- Project Family Pills -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="136" height="32" rx="8" class="pill" />
      <text x="68" y="20" text-anchor="middle" class="fg tag-text">Web experiences</text>

      <rect x="148" y="0" width="144" height="32" rx="8" class="pill" />
      <text x="220" y="20" text-anchor="middle" class="fg tag-text">Everyday software</text>

      <rect x="304" y="0" width="132" height="32" rx="8" class="pill" />
      <text x="370" y="20" text-anchor="middle" class="fg tag-text">The Wiesa suite</text>

      <rect x="448" y="0" width="124" height="32" rx="8" fill="#1b1f1d" stroke="#252b27" stroke-width="1" />
      <text x="510" y="20" text-anchor="middle" class="accent tag-text">quadkore.app ↗</text>
    </g>
  </g>

  <!-- Right Column: Emblem Card (#1b1f1d) -->
  <g transform="translate(760, 40)">
    <rect x="0" y="0" width="384" height="280" rx="16" class="surface" />

    <!-- Card Topline -->
    <text x="28" y="38" class="muted card-label">A shared curiosity.</text>
    <text x="356" y="38" text-anchor="end" class="muted card-label">A world of possibilities.</text>
    <line x1="28" y1="54" x2="356" y2="54" stroke="#252b27" stroke-width="1" />

    <!-- Center Emblem -->
    <g transform="translate(152, 92)">
      <rect x="-16" y="-16" width="112" height="112" rx="20" fill="#141716" stroke="#252b27" stroke-width="1.5" />
      <svg x="8" y="8" width="64" height="64" viewBox="0 0 32 32" fill="none">
        <path d="M4 4h9v11L24 4h8L19 17l13 11H20L13 21v7H4V4Z" fill="#f1f1e9" />
        <path d="M4 4h3v24H4z" fill="#bed6a5" />
      </svg>
    </g>

    <!-- Card Bottomline -->
    <line x1="28" y1="214" x2="356" y2="214" stroke="#252b27" stroke-width="1" />
    <text x="28" y="238" class="fg card-footer">Different ideas.</text>
    <text x="28" y="258" class="accent card-footer">One QuadKore.</text>
    <text x="356" y="252" text-anchor="end" class="accent" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">+</text>
  </g>
</svg>
